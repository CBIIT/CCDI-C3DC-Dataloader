          diagnosis:
            type: keyword
          diagnosis_classification_system:
            type: keyword
          disease_phase:
            type: keyword
      # Survival records
      survivals:
        type: nested
        properties:
          age_at_last_known_survival_status:
            type: integer
          cause_of_death:
            type: keyword
          first_event:
