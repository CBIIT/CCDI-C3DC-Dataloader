Indices:
  - index_name: c3dc_static_pages
    type: about_file
    mapping:
      page:
        type: search_as_you_type
      title:
        type: search_as_you_type
      primaryContentImage:
        type: text
      content:
        type: object

  - index_name: consent_groups
    type: neo4j
    mapping:
      consent_group_name:
        type: keyword
      consent_group_number:
        type: keyword
    cypher_query: >
      MATCH (stu:study)<-[:of_consent_group]-(cg:consent_group)
      RETURN
        cg.consent_group_name AS consent_group_name,
        cg.consent_group_number AS consent_group_number;

  - index_name: home_stats
    type: neo4j
    mapping:
      num_diseases:
        type: integer
      num_participants:
        type: integer
      num_reference_files:
        type: integer
      num_studies:
        type: integer
      num_survivals:
        type: integer
    cypher_query: >
      MATCH (p:participant)-[:of_participant]->(cg:consent_group)-[:of_consent_group]->(stu:study)
      WITH COUNT(DISTINCT p) AS num_participants, COUNT(DISTINCT stu) AS num_studies
      OPTIONAL MATCH (rf:reference_file)-[:of_reference_file]->(stu)
      WITH num_participants, num_studies, COUNT(DISTINCT rf) AS num_reference_files
      OPTIONAL MATCH (sur:survival)-[:of_survival]->(p)
      WITH num_participants, num_studies, num_reference_files, COUNT(DISTINCT sur) AS num_survivals
      OPTIONAL MATCH (d:diagnosis)-[:of_diagnosis]->(p)
      WITH num_participants, num_studies, num_reference_files, num_survivals, COUNT(DISTINCT d.diagnosis) AS num_diseases
      RETURN
        num_diseases,
        num_participants,
        num_studies,
        num_survivals,
        num_reference_files;

  # Studies with nested participants with nested other records
  - index_name: cohorts
    type: neo4j
    mapping:
      # Study fields
      dbgap_accession:
        type: keyword
      # Consent Group fields
      consent_group_name:
        type: keyword
      consent_group_number:
        type: keyword
      # Participant fields
      id:
        type: keyword
      participant_id:
        type: keyword
        normalizer: lowercase
      race: # list
        type: keyword
      sex_at_birth:
        type: keyword
      # Diagnosis records
      diagnoses:
        type: nested
        properties:
          id:
            type: keyword
          diagnosis_id:
            type: keyword
          age_at_diagnosis:
            type: integer
          anatomic_site:
            type: keyword
          diagnosis:
            type: keyword
          diagnosis_basis:
            type: keyword
          diagnosis_classification_system:
            type: keyword
          diagnosis_comment:
            type: keyword
          disease_phase:
            type: keyword
          toronto_childhood_cancer_staging:
            type: keyword
          tumor_classification:
            type: keyword
          tumor_grade:
            type: keyword
          tumor_stage_clinical_m:
            type: keyword
          tumor_stage_clinical_n:
            type: keyword
          tumor_stage_clinical_t:
            type: keyword
      # Genetic Analysis fields
      genetic_analyses:
        type: nested
        properties:
          id:
            type: keyword
          genetic_analysis_id:
            type: keyword
          alteration:
            type: keyword
          alteration_effect:
            type: keyword
          alteration_type:
            type: keyword
          chromosome:
            type: keyword
          cytoband:
            type: keyword
          exon:
            type: keyword
          fusion_partner_exon:
            type: keyword
          fusion_partner_gene:
            type: keyword
          gene_symbol: # list
            type: keyword
          genomic_source_category:
            type: keyword
          hgvs_coding:
            type: keyword
          hgvs_genome:
            type: keyword
          hgvs_protein:
            type: keyword
          reference_genome:
            type: keyword
          reported_significance:
            type: keyword
          reported_significance_system:
            type: keyword
          status:
            type: keyword
          test:
            type: keyword
      # Survival records
      survivals:
        type: nested
        properties:
          id:
            type: keyword
          survival_id:
            type: keyword
          age_at_event_free_survival_status:
            type: integer
          age_at_last_known_survival_status:
            type: integer
          cause_of_death:
            type: keyword
          event_free_survival_status:
            type: keyword
          first_event:
            type: keyword
          last_known_survival_status:
            type: keyword
      # Synonym fields
      synonyms:
        type: nested
        properties:
          id:
            type: keyword
          associated_id:
            type: keyword
          data_location:
            type: keyword
          domain_category:
            type: keyword
          domain_description:
            type: keyword
          repository_of_synonym_id:
            type: keyword
      # Treatment records
      treatments:
        type: nested
        properties:
          id:
            type: keyword
          treatment_id:
            type: keyword
          age_at_treatment_end:
            type: integer
          age_at_treatment_start:
            type: integer
          treatment_agent: # list
            type: keyword
          treatment_type:
            type: keyword
      # Treatment Response records
      treatment_responses:
        type: nested
        properties:
          id:
            type: keyword
          treatment_response_id:
            type: keyword
          age_at_response:
            type: integer
          response:
            type: keyword
          response_category:
            type: keyword
          response_system:
            type: keyword
    cypher_query: >
      MATCH (p:participant)-[:of_participant]->(cg:consent_group)-[:of_consent_group]->(stu:study)
      OPTIONAL MATCH (d:diagnosis)-[:of_diagnosis]->(p)
      OPTIONAL MATCH (ga:genetic_analysis)-[:of_genetic_analysis]->(p)
      OPTIONAL MATCH (sur:survival)-[:of_survival]->(p)
      OPTIONAL MATCH (syn:synonym)-[:of_synonym]->(p)
      OPTIONAL MATCH (t:treatment)-[:of_treatment]->(p)
      OPTIONAL MATCH (tresp:treatment_response)-[:of_treatment_response]->(p)
      WITH
        *,
        CASE
          WHEN ga.gene_symbol STARTS WITH '[' AND ga.gene_symbol ENDS WITH ']' THEN
            [x IN split(replace(substring(ga.gene_symbol, 1, size(ga.gene_symbol)-2), "'", ""), ",") | 
              CASE 
                WHEN apoc.text.replace(trim(x), '^[^A-Za-z0-9]+', '') = '' 
                THEN 'Not Reported' 
                ELSE apoc.text.replace(trim(x), '^[^A-Za-z0-9]+', '') 
              END
            ]
          ELSE
            [CASE 
              WHEN apoc.text.replace(trim(ga.gene_symbol), '^[^A-Za-z0-9]+', '') = '' 
              THEN 'Not Reported' 
              ELSE apoc.text.replace(trim(ga.gene_symbol), '^[^A-Za-z0-9]+', '') 
            END]
        END AS gene_symbol_arr
      RETURN
        stu.dbgap_accession AS dbgap_accession,
        cg.consent_group_name AS consent_group_name,
        cg.consent_group_number AS consent_group_number,

        p.id AS id,
        p.participant_id AS participant_id,
        apoc.text.split(p.race, ';') AS race,
        p.sex_at_birth AS sex_at_birth,

        // Diagnosis records
        (CASE
          WHEN COUNT(DISTINCT d) > 0 THEN COLLECT(DISTINCT {
            id: d.id,
            diagnosis_id: d.diagnosis_id,
            age_at_diagnosis: d.age_at_diagnosis,
            anatomic_site: d.anatomic_site,
            diagnosis: d.diagnosis,
            diagnosis_basis: apoc.text.split(d.diagnosis_basis, ';'),
            diagnosis_classification_system: apoc.text.split(d.diagnosis_classification_system, ';'),
            diagnosis_comment: d.diagnosis_comment,
            disease_phase: d.disease_phase,
            toronto_childhood_cancer_staging: d.toronto_childhood_cancer_staging,
            tumor_classification: d.tumor_classification,
            tumor_grade: d.tumor_grade,
            tumor_stage_clinical_m: d.tumor_stage_clinical_m,
            tumor_stage_clinical_n: d.tumor_stage_clinical_n,
            tumor_stage_clinical_t: d.tumor_stage_clinical_t
          })
          ELSE []
        END) AS diagnoses,

        // Genetic Analysis fields
        (CASE
          WHEN COUNT(DISTINCT ga) > 0 THEN COLLECT(DISTINCT {
            id: ga.id,
            genetic_analysis_id: ga.genetic_analysis_id,
            alteration: ga.alteration,
            alteration_effect: ga.alteration_effect,
            alteration_type: ga.alteration_type,
            chromosome: ga.chromosome,
            cytoband: ga.cytoband,
            exon: ga.exon,
            fusion_partner_exon: ga.fusion_partner_exon,
            fusion_partner_gene: ga.fusion_partner_gene,
            gene_symbol: apoc.coll.toSet(gene_symbol_arr),
            genomic_source_category: ga.genomic_source_category,
            hgvs_coding: ga.hgvs_coding,
            hgvs_genome: ga.hgvs_genome,
            hgvs_protein: ga.hgvs_protein,
            reference_genome: ga.reference_genome,
            reported_significance: ga.reported_significance,
            reported_significance_system: ga.reported_significance_system,
            status: ga.status,
            test: ga.test
          })
          ELSE []
        END) AS genetic_analyses,

        // Survival records
        (CASE
          WHEN COUNT(DISTINCT sur) > 0 THEN COLLECT(DISTINCT {
            id: sur.id,
            survival_id: sur.survival_id,
            age_at_event_free_survival_status: sur.age_at_event_free_survival_status,
            age_at_last_known_survival_status: sur.age_at_last_known_survival_status,
            cause_of_death: sur.cause_of_death,
            event_free_survival_status: sur.event_free_survival_status,
            first_event: sur.first_event,
            last_known_survival_status: sur.last_known_survival_status
          })
          ELSE []
        END) AS survivals,

        // Synonym records
        (CASE
          WHEN COUNT(DISTINCT syn) > 0 THEN COLLECT(DISTINCT {
            id: syn.id,
            associated_id: syn.associated_id,
            data_location: CASE WHEN syn.data_location='Not Reported' THEN NULL ELSE syn.data_location END,
            domain_category: CASE WHEN syn.domain_category='Not Reported' THEN NULL ELSE syn.domain_category END,
            domain_description: CASE WHEN syn.domain_description='Not Reported' THEN NULL ELSE syn.domain_description END,
            repository_of_synonym_id: CASE WHEN syn.repository_of_synonym_id='Not Reported' THEN NULL ELSE syn.repository_of_synonym_id END
          })
          ELSE []
        END) AS synonyms,

        // Treatment records
        (CASE
          WHEN COUNT(DISTINCT t) > 0 THEN COLLECT(DISTINCT {
            id: t.id,
            treatment_id: t.treatment_id,
            age_at_treatment_end: t.age_at_treatment_end,
            age_at_treatment_start: t.age_at_treatment_start,
            treatment_agent: apoc.text.split(t.treatment_agent, ';'),
            treatment_type: t.treatment_type
          })
          ELSE []
        END) AS treatments,

        // Treatment Response records
        (CASE
          WHEN COUNT(DISTINCT tresp) > 0 THEN COLLECT(DISTINCT {
            id: tresp.id,
            treatment_response_id: tresp.treatment_response_id,
            age_at_response: tresp.age_at_response,
            response: tresp.response,
            response_category: tresp.response_category,
            response_system: tresp.response_system
          })
          ELSE []
        END) AS treatment_responses;

