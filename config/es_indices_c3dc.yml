    type: neo4j
    cypher_query: >
      MATCH (ga:genetic_analysis)-[:of_genetic_analysis]->(p:participant),
        (cg:consent_group)<-[:of_participant]-(p),
        (stu:study)<-[:of_consent_group]-(cg)
      OPTIONAL MATCH (d:diagnosis)-[:of_diagnosis]->(p)
